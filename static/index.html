<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이야기 읽기 친구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF6EA;
    --paper-line: #E7DEC8;
    --ink: #223843;
    --ink-soft: #5B6B72;
    --leaf: #4C7C59;
    --leaf-dark: #34573E;
    --mustard: #E8A33D;
    --coral: #E8724C;
    --card-shadow: 0 6px 0 rgba(34,56,67,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.1em;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    padding: 2.5rem 1.25rem 4rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 2rem; }
  header h1 {
    font-family: 'Jua', sans-serif;
    font-size: 2.4rem;
    color: var(--leaf-dark);
    margin: 0 0 0.3rem;
    letter-spacing: -0.01em;
  }
  header p { color: var(--ink-soft); margin: 0; font-size: 0.95rem; }

  .panel {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .picker-row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: stretch; }
  .grade-toggle { display: flex; border-radius: 12px; overflow: hidden; border: 2px solid var(--leaf); flex-shrink: 0; }
  .grade-toggle button {
    border: none; background: #fff; color: var(--leaf-dark);
    font-family: 'Jua', sans-serif; font-size: 0.95rem;
    padding: 0.65rem 1rem; cursor: pointer; transition: all .15s;
  }
  .grade-toggle button.active { background: var(--leaf); color: #fff; }

  #topic {
    flex: 1; min-width: 160px;
    border: 2px solid var(--paper-line); border-radius: 12px;
    padding: 0.65rem 0.9rem; font-size: 0.95rem; font-family: inherit;
    color: var(--ink); outline: none;
  }
  #topic:focus { border-color: var(--mustard); }

  .btn {
    font-family: 'Jua', sans-serif; font-size: 0.95rem;
    border: none; border-radius: 12px; padding: 0.65rem 1.2rem;
    background: var(--mustard); color: #fff; cursor: pointer;
    box-shadow: 0 3px 0 #b97a1f; transition: transform .1s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b97a1f; }
  .btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

  /* 책장처럼 보이는 지문 카드 */
  .book {
    position: relative;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 4px 16px 16px 4px;
    box-shadow: var(--card-shadow), -6px 0 0 var(--leaf);
    padding: 1.8rem 1.6rem;
    margin-bottom: 1.5rem;
  }
  .book::before {
    content: "";
    position: absolute; left: -10px; top: 14px; bottom: 14px; width: 4px;
    background: repeating-linear-gradient(to bottom, var(--mustard) 0 6px, transparent 6px 12px);
  }
  .book h2 {
    font-family: 'Jua', sans-serif; color: var(--coral);
    font-size: 1.35rem; margin: 0 0 0.9rem;
  }
  .book .body-text {
    white-space: pre-wrap; line-height: 1.9; font-size: 1.02rem;
  }
  .book .source {
    margin-top: 1rem; font-size: 0.78rem; color: var(--ink-soft);
    border-top: 1px dashed var(--paper-line); padding-top: 0.6rem;
  }

  /* 코칭 대화 */
  .chat { display: flex; flex-direction: column; gap: 0.8rem; }
  .bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; }
  .bubble.agent {
    align-self: flex-start; background: #EFF6F0; border: 1px solid #D7E8DA;
    border-bottom-left-radius: 4px;
  }
  .bubble.agent .who { color: var(--leaf-dark); }
  .bubble.student {
    align-self: flex-end; background: var(--mustard); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.student .who { color: #fff8e8; }
  .who { font-family: 'Jua', sans-serif; font-size: 0.78rem; display: block; margin-bottom: 0.25rem; opacity: 0.8; }
  .stage-tag {
    align-self: center; font-size: 0.75rem; color: var(--ink-soft);
    background: var(--paper); border: 1px dashed var(--paper-line);
    padding: 0.2rem 0.7rem; border-radius: 999px; margin: 0.2rem 0;
  }

  .input-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
  #student-input {
    flex: 1; border: 2px solid var(--paper-line); border-radius: 12px;
    padding: 0.65rem 0.9rem; font-size: 0.95rem; font-family: inherit; outline: none;
  }
  #student-input:focus { border-color: var(--mustard); }

  .hint { color: var(--ink-soft); font-size: 0.85rem; text-align: center; }
  .done-banner {
    text-align: center; font-family: 'Jua', sans-serif; color: var(--leaf-dark);
    background: #EFF6F0; border: 1px dashed var(--leaf); border-radius: 12px;
    padding: 0.8rem; margin-top: 0.8rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📖 이야기 읽기 친구</h1>
    <p>학년과 궁금한 주제를 고르면, 새로운 이야기를 들려줄게요.</p>
  </header>

  <section class="panel">
    <div class="picker-row">
      <div class="grade-toggle">
        <button type="button" data-grade="low" class="active">저학년</button>
        <button type="button" data-grade="high">고학년</button>
      </div>
      <input id="topic" type="text" placeholder="예: 용감한 동물 친구 이야기" />
      <button class="btn" id="get-passage-btn">지문 받기</button>
    </div>
  </section>

  <div id="passage-area"></div>
  <div id="chat-area"></div>
</div>

<script>
const API = ""; // 같은 origin에서 서빙되므로 상대경로 사용
let selectedGrade = "low";
let sessionId = null;
let passageId = null;
let coachingDone = false;

document.querySelectorAll(".grade-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".grade-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedGrade = btn.dataset.grade;
  });
});

function parsePassage(raw) {
  const titleMatch = raw.match(/\[제목\]\s*[:：]?\s*(.+)/);
  const bodyMatch = raw.match(/\[읽기 지문\]\s*[:：]?\s*([\s\S]+)/);
  return {
    title: titleMatch ? titleMatch[1].trim() : "오늘의 이야기",
    body: bodyMatch ? bodyMatch[1].trim() : raw.trim(),
  };
}

function renderPassage(title, body, source) {
  const area = document.getElementById("passage-area");
  area.innerHTML = `
    <div class="book">
      <h2>${title}</h2>
      <div class="body-text">${body}</div>
      <div class="source">원문 출처: ${source}</div>
    </div>
  `;
}

function ensureChatPanel() {
  const area = document.getElementById("chat-area");
  if (!document.getElementById("chat-panel")) {
    area.innerHTML = `
      <section class="panel">
        <div id="chat" class="chat"></div>
        <div class="input-row" id="input-row">
          <input id="student-input" type="text" placeholder="생각을 자유롭게 적어보세요" />
          <button class="btn" id="send-btn">보내기</button>
        </div>
      </section>
    `;
    document.getElementById("chat-panel");
    document.getElementById("send-btn").addEventListener("click", sendStudentMessage);
    document.getElementById("student-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendStudentMessage();
    });
  }
}

function addBubble(who, text) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "bubble " + (who === "agent" ? "agent" : "student");
  div.innerHTML = `<span class="who">${who === "agent" ? "튜터" : "나"}</span>${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addStageTag(stage) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "stage-tag";
  div.textContent = "지금 단계: " + stage;
  chat.appendChild(div);
}

async function getPassage() {
  const btn = document.getElementById("get-passage-btn");
  const topic = document.getElementById("topic").value.trim() || "재미있는 이야기";
  btn.disabled = true;
  btn.textContent = "이야기를 찾는 중...";

  document.getElementById("chat-area").innerHTML = "";
  coachingDone = false;

  try {
    const res = await fetch(`${API}/api/passage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ grade_track: selectedGrade, topic }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || "지문을 가져오지 못했어요");
    const data = await res.json();
    passageId = data.passage_id;
    sessionId = crypto.randomUUID();

    const { title, body } = parsePassage(data.text);
    renderPassage(title, body, data.source);

    ensureChatPanel();
    await startCoaching();
  } catch (err) {
    document.getElementById("passage-area").innerHTML =
      `<div class="panel hint">이야기를 불러오지 못했어요: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "지문 받기";
  }
}

async function startCoaching() {
  const res = await fetch(`${API}/api/coach/turn`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, passage_id: passageId, user_message: "" }),
  });
  const data = await res.json();
  addBubble("agent", data.agent_message);
  addStageTag(data.stage);
  if (data.stage === "완료") finishCoaching();
}

async function sendStudentMessage() {
  if (coachingDone) return;
  const input = document.getElementById("student-input");
  const msg = input.value.trim();
  if (!msg) return;
  addBubble("student", msg);
  input.value = "";

  const res = await fetch(`${API}/api/coach/turn`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, passage_id: passageId, user_message: msg }),
  });
  const data = await res.json();
  addBubble("agent", data.agent_message);
  addStageTag(data.stage);
  if (data.stage === "완료") finishCoaching();
}

function finishCoaching() {
  coachingDone = true;
  const row = document.getElementById("input-row");
  if (row) row.insertAdjacentHTML("afterend",
    `<div class="done-banner">🎉 오늘의 이야기 학습을 모두 마쳤어요!</div>`);
}

document.getElementById("get-passage-btn").addEventListener("click", getPassage);
</script>
</body>
</html>
